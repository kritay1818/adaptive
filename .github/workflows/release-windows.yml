name: Release (Windows)

# Runs when a version tag is pushed, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to attach the installer to the GitHub release

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      # Keep LF line endings so the formatting check behaves like it does locally.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  build:
    name: Build installer
    needs: test
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Tag must match package.json version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version" >&2
            exit 1
          fi

      # ---------------------------------------------------------------------------------------------
      # CODE SIGNING (optional, NOT required yet). Without secrets the installer is built unsigned.
      #  Option A - certificate (.pfx): add repository secrets WIN_CSC_LINK (base64 or https URL of the
      #             .pfx) and WIN_CSC_KEY_PASSWORD. electron-builder signs automatically when set.
      #  Option B - Azure Trusted Signing: add AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and
      #             put win.azureSignOptions (endpoint, codeSigningAccountName, certificateProfileName)
      #             in package.json "build"; then uncomment the three AZURE_* lines below.
      # ---------------------------------------------------------------------------------------------
      # Unsigned build (default): signing auto-discovery is switched off, so an empty secret can never break the build.
      - name: Build Windows installer and portable exe (unsigned)
        if: ${{ env.HAS_CERT != 'true' }}
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Signed build: runs only when the WIN_CSC_LINK secret exists.
      - name: Build Windows installer and portable exe (signed)
        if: ${{ env.HAS_CERT == 'true' }}
        run: npm run build:win
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - uses: actions/upload-artifact@v4
        with:
          name: ADActive-windows-${{ github.ref_name }}
          path: |
            dist/ADActive-Setup-*.exe
            dist/ADActive-*-portable.exe
          if-no-files-found: error

      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ADActive-Setup-*.exe
            dist/ADActive-*-portable.exe
          draft: true
